name: Tests and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore demo signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: demo-debug-key-v1-${{ github.repository }}
      - name: Configure optional Firebase
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: python scripts/configure_firebase.py
      - name: Test, lint and build
        run: ./gradlew -PincludeAndroid=true :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-on-phone-demo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-on-phone-demo-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html

  experience:
    name: Emulator UX and Lottie
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise splash, auth, navigation and result screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Collect UX screenshots
        if: always()
        run: |
          mkdir -p ux-screenshots
          adb pull /sdcard/Android/data/dev.breda.tap/files/ux ux-screenshots/ || true
      - name: Upload UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-on-phone-demo-ux-evidence
          path: |
            ux-screenshots/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 30
